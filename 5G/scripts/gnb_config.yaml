# This example configuration outlines how to configure the srsRAN Project gNB to create a single FDD cell
# transmitting in band 3, with 20 MHz bandwidth and 15 kHz sub-carrier-spacing. A USRP B200 is configured 
# as the RF frontend using split 8, with a Leo Bodnar GPSDO as an external reference clock. 

# This particular configuration is intended to be used with srsUE. Note the `pdcch` parameters set in the 
# `cell_cfg` section. These are set to match the capabilities of srsUE.

qos:
  -
    five_qi: 1
    rlc:
      mode: um-bidir
      um-bidir:
        tx:
          sn: 12
        rx:
          sn: 12
          t-reassembly: 200
    pdcp:
      tx:
        sn: 18
        discard_timer: -1
      rx:
        sn: 18
        t_reordering: 3000
  -
    five_qi: 2
    rlc:
      mode: um-bidir
      um-bidir:
        tx:
          sn: 12
        rx:
          sn: 12
          t-reassembly: 200
    pdcp:
      tx:
        sn: 18
        discard_timer: -1
      rx:
        sn: 18
        t_reordering: 3000
  -
    five_qi: 5
    rlc:
      mode: am
      am:
        tx:
          sn: 18
          t-poll-retransmit: 4000
        rx:
          sn: 18
          t-reassembly: 200
          t-status-prohibit: 2400
    pdcp:
      tx:
        sn: 18
        discard_timer: -1
      rx:
        sn: 18
        t_reordering: 3000
  -
    five_qi: 7
    rlc:
      mode: um-bidir
      um-bidir:
        tx:
          sn: 12
        rx:
          sn: 12
          t-reassembly: 200
    pdcp:
      tx:
        sn: 18
        discard_timer: -1
      rx:
        sn: 18
        t_reordering: 3000
  -
    five_qi: 9
    rlc:
      mode: am
      am:
        tx:
          sn: 18
          t-poll-retransmit: 4000
        rx:
          sn: 18
          t-reassembly: 200
          t-status-prohibit: 2400
    pdcp:
      tx:
        sn: 12
        discard_timer: -1
      rx:
        sn: 12
        t_reordering: 3000
    
amf:
  addr: 127.0.0.5                                             # The address or hostname of the AMF.
  bind_addr: 127.0.0.10                                # A local IP that the gNB binds to for>

rf_driver:
  #time_alignment_calibration:
  device_driver: uhd                                              # The RF driver name.
  device_args: type=b200                                          # Optionally pass arguments to the selected RF driver.
  #sync: external                                                  # Set sync to external. This set-up uses a LEO BODNAR GPDSO providing a 10 MHz ref.
  #clock: external
  srate: 11.52
                                                     # RF sample rate might need to be adjusted according to selected bandwidth.
  tx_gain: 50                                                     # Transmit gain of the RF might need to adjusted to the given situation.
  rx_gain: 10                                                  # Receive gain of the RF might need to adjusted to the given situation. 

cell_cfg:
  dl_arfcn: 368500                                                # ARFCN of the downlink carrier (center frequency).
  band: 3                                                         # The NR band.
  channel_bandwidth_MHz: 10                                       # Bandwith in MHz. Number of PRBs will be automatically derived.
  common_scs: 15                                                  # Subcarrier spacing in kHz used for data.
  plmn: "00101"                                                   # PLMN broadcasted by the gNB.
  tac: 7                                                          # Tracking area code (needs to match the core configuration). 
  pdcch:
    ss_type: common                                            # Set search space to common to match capabilities
  prach: 
    prach_config_index: 26
    zero_correlation_zone: 0
    max_msg3_harq_retx: 0
#  pdsch:
#    nof_harqs: 16

log:
  filename: /tmp/gnb.log                                          # Path of the log file.
  all_level: debug                                                 # Logging level applied to all layers.
  hex_max_size: 0

pcap:
  mac_enable: enable                                              # Set to true to enable MAC-layer PCAP>
  mac_filename: /tmp/gnb_mac.pcap                                 # Path where the MAC PCAP is stored.
  ngap_enable: enable                                             # Set to true to enable NGAP PCAPs.
  ngap_filename: /tmp/gnb_ngap.pcap                               # Path where the NGAP PCAP is stored.
